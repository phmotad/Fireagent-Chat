version: '3'

services:
  rails:
    image: 'ghcr.io/phmotad/fireagent-chat:latest'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - DISABLE_ENTERPRISE=true
      - FRONTEND_URL=${SERVICE_URL_RAILS}
      - INTERNAL_HOST_URL=http://rails:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME=${BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME:-FireAgent}
      - BAILEYS_PROVIDER_DEFAULT_URL=${BAILEYS_PROVIDER_DEFAULT_URL:-http://baileys-api:3025}
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
      - BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL=true
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-FireAgent <noreply@fireagent.com.br>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - BRAND_ASSETS_URL=${BRAND_ASSETS_URL:-}
      - BRAND_NAME=${BRAND_NAME:-FireAgent}
      - INSTALLATION_NAME=${INSTALLATION_NAME:-FireAgent}
    command:
      - sh
      - '-c'
      - >
        set -e &&
        rm -rf /app/tmp/pids/server.pid /app/tmp/cache/* &&
        echo "Waiting for postgres..." &&
        until pg_isready -h $${POSTGRES_HOST} -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USERNAME}; do 
          echo "Postgres not ready, waiting..." && 
          sleep 2; 
        done &&
        echo "Database ready. Running migrations..." &&
        bundle exec rails db:chatwoot_prepare 2>&1 || {
          echo "Migration failed. Error details:" &&
          bundle exec rails db:migrate:status 2>&1 || true &&
          exit 1
        } &&
        if [ -n "$${BRAND_ASSETS_URL}" ]; then
          deployment/extract_brand_assets.sh "$${BRAND_ASSETS_URL}" || true;
        fi &&
        echo "Starting Rails server..." &&
        exec bundle exec rails server -b 0.0.0.0 -p 3000
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- --header="Accept: text/html" http://127.0.0.1:3000/ || exit 1'
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 40s

  sidekiq:
    image: 'ghcr.io/phmotad/fireagent-chat:latest'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
      - rails
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - DISABLE_ENTERPRISE=true
      - FRONTEND_URL=${SERVICE_URL_RAILS}
      - INTERNAL_HOST_URL=http://rails:3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SECRETKEYBASE}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME=${BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME:-FireAgent}
      - BAILEYS_PROVIDER_DEFAULT_URL=${BAILEYS_PROVIDER_DEFAULT_URL:-http://baileys-api:3025}
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
      - BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL=true
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-FireAgent <noreply@fireagent.com.br>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    command:
      - sh
      - '-c'
      - >
        set -e &&
        echo "Waiting for postgres and redis..." &&
        until pg_isready -h $${POSTGRES_HOST} -p $${POSTGRES_PORT:-5432} -U $${POSTGRES_USERNAME}; do 
          echo "Postgres not ready, waiting..." && 
          sleep 2; 
        done &&
        echo "Waiting for Rails to initialize database..." &&
        sleep 15 &&
        echo "Starting Sidekiq..." &&
        exec bundle exec sidekiq -C config/sidekiq.yml
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'ps aux | grep [s]idekiq || exit 1'
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 30s

  postgres:
    image: 'ghcr.io/fazer-ai/postgres-16-pgvector:latest'
    restart: always
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot_production}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1'
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 10s

  redis:
    image: 'redis:alpine'
    restart: always
    command:
      - sh
      - '-c'
      - 'redis-server --requirepass "${SERVICE_PASSWORD_REDIS}"'
    volumes:
      - 'redis:/data'
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -h localhost -p 6379 -a $${REDIS_PASSWORD} ping || exit 1'
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 10s

  baileys-api:
    image: 'ghcr.io/fazer-ai/baileys-api:latest'
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-error}
      - BAILEYS_PROVIDER_DEFAULT_API_KEY=${BAILEYS_PROVIDER_DEFAULT_API_KEY}
    command:
      - sh
      - '-c'
      - 'bun manage-api-keys create user ${BAILEYS_PROVIDER_DEFAULT_API_KEY} && bun start'
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:3025/status || exit 1'
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 30s

  fireagent-brain:
    image: 'ghcr.io/phmotad/fireagent-chat:latest'
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-chatwoot_production}
    command:
      - sh
      - '-c'
      - 'cd fireagent-brain && uvicorn main:app --host 0.0.0.0 --port 8000'
    depends_on:
      - redis
      - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:8000/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  storage:
  postgres:
  redis:
